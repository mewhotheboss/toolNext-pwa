<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8" />

  <!-- Abstract TN / Tool Shapes -->
  <g transform="translate(136, 126)">
    <!-- Calendar/Clock Grid Grid -->
    <path d="M 20 80 Q 20 50 50 50 L 190 50 Q 220 50 220 80 L 220 190 Q 220 220 190 220 L 50 220 Q 20 220 20 190 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.9" filter="url(#glow)" />
    
    <!-- Clock Hands (also looks like an L or T-square) -->
    <path d="M 120 120 L 120 85 M 120 120 L 155 120" 
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Crescent Moon Overlay (for Tahajjut time) -->
    <path d="M 230 40 A 70 70 0 1 0 170 170 A 55 55 0 1 1 230 40 Z" 
          fill="url(#accentGrad)" opacity="0.95" filter="url(#glow)" />
          
    <!-- Small Star -->
    <polygon points="190,75 193,81 200,82 195,87 196,93 190,90 184,93 185,87 180,82 187,81" fill="#ffffff" />
  </g>

  <!-- Glowing Dot in center -->
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
